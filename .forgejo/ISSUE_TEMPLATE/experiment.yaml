name: Experiment
about: A physics/ML run or artifact to track — outside work, not a coding ticket
labels:
  - action
body:
  - type: markdown
    attributes:
      value: |
        This is outside work (an `action`-labelled ticket), **not a
        coding ticket** — the dev-bot coding loop must not claim
        `action`. Dispatch runs it. The fields below are the paper
        trail for the vault run: track its outputs with `run` /
        `artifact`, and record verdicts under `judgment`.
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Docker image (or image reference) the run executes in.
      placeholder: "disinto/meep:local"
    validations:
      required: true
  - type: textarea
    id: argv
    attributes:
      label: Argv / tool
      description: The exact argv (or tool invocation) the run executes, in order.
      placeholder: "mpb --resolution 256 --frames 32"
    validations:
      required: true
  - type: textarea
    id: host-class
    attributes:
      label: Host class
      description: Nomad class / host tier the run dispatches to (e.g. gpu-a100, cpu-large, meep-box).
      placeholder: "meep-box"
    validations:
      required: true
  - type: textarea
    id: artifact-glob
    attributes:
      label: Artifact glob
      description: Glob matching the artifacts this run produces, relative to the run output dir.
      placeholder: "results/*.h5"
    validations:
      required: true
  - type: dropdown
    id: resource-class
    attributes:
      label: Resource class
      description: Compute resource class the run consumes.
      options:
        - cpu
        - gpu
        - meep
        - voxel
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Campaign / run-dir links, prior runs, related issues.
