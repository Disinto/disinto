# tape/rubrics/failure-signature.toml — The 8 allowed failure-signature
# labels for dev-loop tape outcomes (documentation-by-schema, #1400).
# Nothing reads this file yet.

# The issue spec was vague or ambiguous; work could not proceed until it was clarified.
spec-unclear = true
# A test failed intermittently under otherwise-identical conditions.
flaky-test = true
# The environment or infra was broken (runner, docker, missing deps), not the code.
env-broken = true
# CI ran past its time budget without completing.
ci-timeout = true
# The branch collided with main (or another branch) and needs a merge to continue.
merge-conflict = true
# The issue grew beyond its original scope during implementation.
scope-explosion = true
# The agent looped: it retried the same failing action without making progress.
agent-loop = true
# The failure does not fit any of the other labels.
other = true
