# action-vault/examples/run-experiment.toml
# Example: research-run vault action (#1296, mechanical dispatch in #1308)
#
# Demonstrates the optional research-run fields added in #1296:
# image, host, artifacts, resource_class.
#
# For the run-experiment formula these drive a mechanical dispatch:
#   - image is the container the command runs in (required by the formula)
#   - context is the argv line, e.g. context = "echo ok"
#   - host is an alias from RESOURCES.md; without it, resource_class picks
#     the first fit; without either, the run dispatches locally
#   - artifacts are copied into ops/artifacts/<action-id>/ after the run

id = "run-experiment-20260401"
formula = "run-experiment"
context = "echo ok"

# Secrets to inject (only these get passed to the container). The runner
# installs SSH_KEY/SSH_KNOWN_HOSTS into ~/.ssh when present (AD-006).
secrets = ["SSH_KEY", "SSH_KNOWN_HOSTS"]

# Container image for the run (required by the run-experiment formula)
image = "busybox"

# Host alias from RESOURCES.md (omit to let resource_class pick, or both to
# dispatch locally)
host = "nomad-box-1"

# Glob(s) the runner collects into ops/artifacts/<action-id>/ after the run
# (string or array of strings)
artifacts = ["results/*.csv", "evidence/summary.md"]

# Resource class — cpu | gpu | meep | voxel
resource_class = "gpu"

# 60 minute timeout
timeout_minutes = 60
