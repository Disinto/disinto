# DeepSeek Harness settings — local llama.cpp provider, container variant.
# Baked into the agents image; entrypoint.sh seeds it into $DSH_HOME with
# __DSH_BASE_URL__ replaced by the DSH_BASE_URL env value (#1107 follow-up:
# dsh reads providers from settings.yaml, not from DSH_BASE_URL directly).
llm-pi-ai:
  providers:
    llamacpp:
      displayName: llama.cpp local
      apiKeyEnv: LLAMACPP_API_KEY
      api: openai-completions
      baseURL: __DSH_BASE_URL__
      # llama-server speaks plain chat-completions: no `developer` role,
      # and the output cap is `max_tokens`, not `max_completion_tokens`.
      #
      # The Bonsai embedded template (2026-09-21) defaults thinking ON at
      # xhigh and only uses `reasoning_effort` as prompt instruction wording —
      # not a token budget. pi-ai resolves the below kwargs per request:
      #   reasoningEffort=off  -> { enable_thinking: false }
      #   reasoningEffort=low  -> { enable_thinking: true, reasoning_effort: "low" }
      #   reasoningEffort=off  -> reasoning_effort omitted (omitWhenOff)
      # The wire kwargs are passed through to llama-server so a template that
      # does act on `reasoning_effort` can cap the budget.
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        thinkingFormat: chat-template
        chatTemplateKwargs:
          enable_thinking:
            $var: thinking.enabled
          reasoning_effort:
            $var: thinking.effort
            omitWhenOff: true
      streamIdleTimeoutMs: 600000
      models:
        - id: unsloth/Qwen3.8-27B
          name: Qwen3.8 27B IQ4_XS (local)
          # Routed capacity for compaction math: compaction-basic auto-compacts
          # at thresholdRatio (default 0.8) x capacity = 80k, keeping a 16%
          # recent tail verbatim. Sessions are therefore capped ~80k, then
          # compacted (summarized) instead of growing to the wall-clock.
          contextWindow: 100000
          maxTokens: 32768
          input: [text, image]
          # llama-server maps OpenAI `reasoning_effort` onto the qwen38
          # template kwarg; key = level the harness offers, value = wire spelling.
          reasoningEfforts:
            low: low
            medium: medium
            high: high

agent-default-model:
  provider: llamacpp
  model: unsloth/Qwen3.8-27B
  reasoningEffort: low
