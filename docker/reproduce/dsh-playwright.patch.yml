# dsh --patch overlay for the reproduce/triage/verify sidecars: the Playwright
# MCP server (docker/reproduce/Dockerfile installs playwright-mcp and Debian's
# chromium). The model sees its tools as mcp__playwright__<tool>.
- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: playwright-mcp
        args: ['--headless', '--isolated', '--no-sandbox', '--executable-path', '/usr/bin/chromium', '--output-dir', '/home/agent/data/screenshots']
        failOnStartupError: true
        toolCallTimeoutMs: 120000
