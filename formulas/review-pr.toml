# formulas/review-pr.toml — PR review formula
# The orchestrator (review/review-pr.sh) injects PR context alongside this
# and handles session lifecycle, metadata, API posting, and cleanup.

name        = "review-pr"
description = "AI-powered PR review: understand change, assess quality, decide verdict"
version     = 2
model       = "sonnet"

[context]
files = ["AGENTS.md"]

[[steps]]
id    = "review"
title = "Review the PR and write structured output"
description = """
You are in a checkout of the PR branch with full repo access — read files to
verify claims before flagging issues.

## 1. Understand the change

What is this PR doing and why?
Identify scope: contracts/frontend/backend/docs/infra/formulas/mixed?
Feature, bug fix, refactor, or config change?

## 2. CI relevance

If CI has not passed, decide whether CI matters. Non-code changes (docs,
formulas, TOML, markdown) do NOT need CI — note this in the review body rather
than blocking (the orchestrator skips the CI gate for non-code PRs;
still mention CI relevance when it applies).

## 3. Review checklist

Adapt based on scope. Check for:

- **Bugs & logic errors**: off-by-one, nil/null dereference, missing edge cases, wrong return type, incorrect conditionals
- **Security**: command injection, unquoted bash variables, path traversal, XSS, secret leakage in logs or comments
- **Imports & dependencies**: broken imports, undefined variables, missing deps
- **Architecture**: patterns match AGENTS.md and project conventions
- **Bash** (.sh files): ShellCheck compliance, set -euo pipefail, proper quoting, error handling with || true where appropriate, no echo of secrets
- **Dead code**: unused variables, unreachable branches, leftover debug prints
- **Claim verification**: if docs/README/AGENTS.md changed, verify claims against actual code
- **Acceptance test**: if the issue has an `## Acceptance test` section, check it has explicit shell commands with expected output, references correct file paths/schema (not stubs), and expected output matches what the code produces; a command that cannot run on the live box (e.g. needs a deploy) → flag `needs-deploy-verification`, do NOT approve. See docs/contributing/acceptance-tests.md.
- **File coverage**: the review must reflect EVERY file in "Changed Files". When the "large — not pasted" section replaced the pasted diff, run the diff command it gives and read each changed file from the worktree before judging; a verdict that skips files is incomplete.

Do NOT flag: style preferences with no correctness impact; missing tests unless clearly untested and risky; things that look wrong but actually work (verify first); files truncated from the diff (orchestrator notes truncation).

## 3b. Architecture and documentation consistency

For each BEHAVIORAL change in the diff (not pure bug fixes or formatting):
1. Identify what behavior changed (scheduling, auth flow, container lifecycle, secret handling, ...).
2. Search AGENTS.md for claims about it (`grep -n '<keyword>' AGENTS.md`), plus docs/ and per-directory AGENTS.md files.
3. Check Architecture Decisions for contradictions (`grep -n 'AD-0' AGENTS.md`).
4. If the PR changes behavior described in AGENTS.md or contradicts an AD but does NOT update the docs in the same PR: REQUEST_CHANGES — require the doc update in the same PR.

SKIPPED for pure bug fixes where the intended behavior is unchanged (the code was wrong, not the docs).

## 3c. Infrastructure file review (conditional)

If the diff touches `docker-compose.yml`/`docker-compose.*.yml`, `Dockerfile`/`docker/*`, `.woodpecker/` CI configs, or `docker/agents/entrypoint.sh`, apply this checklist: a single dropped line (volume mount, env var, restart policy) can break a running deployment with no syntax error. Treat dropped infrastructure configuration as a **blocking defect**, not a style choice.

### For docker-compose.yml changes:
1. **Read the full file** in the PR branch and run `git diff <base>..HEAD -- docker-compose.yml` — not just the truncated diff.
2. Check that NONE of these was dropped without explicit justification in the PR description: named volumes (e.g. `agent-data`), bind mounts (config, secrets, SSH keys, shared dirs), env vars (compare the full `environment:` block against base), `restart:` (`unless-stopped` for production), `security_opt:`, networks, resource limits / deploy constraints.
3. If ANY production configuration was dropped unexplained: REQUEST_CHANGES — list each dropped item explicitly.

### For Dockerfile / entrypoint changes:
1. Base image, installed packages, and runtime deps are preserved.
2. Entrypoint/CMD changes don't break container startup.

### For CI config changes:
1. Pipeline steps aren't silently removed.
2. Secret references still match available secrets.

## 3d. Scope discipline

Compare the diff footprint against the stated issue scope:
1. Read the PR title/description to identify what the issue asked for.
2. Estimate expected diff size (e.g. "add 3 env vars" ≈ 5-10 lines compose + ~5 lines scripts).
3. If ANY single file exceeds 3x the expected scope, flag: "this file changed N lines but the issue scope suggests ~M."

Scope violations in infrastructure files (compose, Dockerfiles, CI) are **blocking**: REQUEST_CHANGES — ask the author to split out-of-scope changes into a separate PR or justify them. For other files, advisory only: a non-blocking COMMENT.

## 3e. Stale-base regression (conditional, #896)

If the orchestrator injected a `## Stale-base regression check (BLOCKER)` section, the merge would overwrite upstream changes that landed on main since the PR's base. Set verdict=REQUEST_CHANGES, quote the file list verbatim, and instruct the author to rebase on main and re-resolve conflicts so upstream changes are preserved. Exception only if the PR description explicitly states the reverts are intentional with a clear rationale.

## 4. Vault item quality (conditional)

If the PR adds or modifies vault item files (`vault/pending/*.md` in the ops repo), apply these checks on top of the standard checklist — a vault PR must also pass it.

### Required sections
Every vault item must contain all five sections with non-empty content: **What** (what is needed), **Why** (what it unblocks and why now), **Unblocks** (specific issue numbers, e.g. #123), **Human Action** (specific steps for the human), **Factory Will Then** (what happens after approval). If any is missing or empty: REQUEST_CHANGES — quote the missing section names.

### Human Action must be specific
Must contain concrete, actionable steps — the filing agent must have researched before escalating. PASS: "Go to github.com/organizations/new, create org named disinto"; "Add SMTP_HOST=mail.example.com to .env.enc via sops". FAIL: "Decide the approach for #466"; "Figure out which provider to use". If vague or pushes decision-making to the human: REQUEST_CHANGES.

### Dedup check
Check `$OPS_REPO_ROOT/vault/pending/`, `vault/approved/`, `vault/fired/` for a similar item (same resource, same ask). If a duplicate or near-duplicate exists, REQUEST_CHANGES and reference the existing item.

## 5. External action detection (token separation)

Agents must NEVER execute external actions directly (publish, deploy, post, push to external registries, third-party API calls) — per AD-006 they MUST go through vault dispatch: the agent files a vault item (`$OPS_REPO_ROOT/vault/pending/*.json`), the runner executes it with injected secrets.

Scan the diff for these patterns in agent code (`dev/`, `action/`, `planner/`, `gardener/`, `supervisor/`, `predictor/`, `review/`, `formulas/`, `lib/`):
- Direct publish: `clawhub publish`, `npm publish`, `cargo publish`, `docker push`, `gh release create`, or similar
- Direct deploy: `ssh ... deploy`, `rsync` to external hosts, `kubectl apply`, `helm install`, cloud CLI deploys
- Direct external API calls: `curl`/`wget` to external services with auth tokens, social media APIs, sending emails
- Token usage: direct references to `GITHUB_TOKEN`, `CLAWHUB_TOKEN`, or other vault-only secrets (outside `vault/`)

If ANY appear WITHOUT routing through vault dispatch (file a vault PR on the ops repo — see #73-#77): REQUEST_CHANGES, explaining that external actions must go through vault dispatch per AD-006 (file a vault item instead of executing).

**Exceptions** (do NOT flag): code inside `vault/` (vault handles secrets itself); comments/docs explaining the architecture; `bin/disinto` setup commands managing `secrets/*.enc` and the `run` subcommand; local operations (git push to forge, forge API calls with `FORGE_TOKEN`).

## 6. Re-review (if previous review is provided)

If a previous review and incremental diff were injected:
1. For each previous finding, check if it was addressed; report status: fixed / not_fixed / partial with explanation
2. Check for new issues introduced by the fix commits
3. Be fair — acknowledge well-addressed feedback

Use the incremental diff per finding, the full diff for overall correctness.

## 7. Follow-up issues (pre-existing tech debt)

If you discover pre-existing issues (NOT introduced by this PR), file tech-debt issues via the forge API (all calls use `Authorization: token $FORGE_TOKEN`):
1. Look up the `tech-debt` label id via `GET $FORGE_API/labels` (create via `POST $FORGE_API/labels` if missing).
2. Duplicate check: `GET "$FORGE_API/issues?state=open&labels=tech-debt&limit=50"` — skip if an open issue has the same title.
3. Only if no duplicate: `POST $FORGE_API/issues` with body `"Flagged by AI reviewer in PR #NNN.\n\n## Problem\n...\n\n---\n*Auto-created from AI review*"`, labels `[<TECH_DEBT_ID>]`.

File for every finding rated **medium** or higher that is pre-existing, plus **low** findings that are correctness risks (dead code masking bugs, misleading docs, unguarded variables under set -u). Do NOT file for style preferences, naming opinions, missing comments, or speculative improvements with no concrete failure mode. When in doubt, file.

## 8. Verdict

Choose one:
- **APPROVE**: Change is correct, complete, and follows conventions
- **REQUEST_CHANGES**: Has real issues that must be fixed before merge
- **DISCUSS**: Unclear intent, design question, or needs human conversation

Bias toward APPROVE for small, correct changes; REQUEST_CHANGES only for actual problems (bugs, security, broken functionality, missing required behavior); DISCUSS sparingly. The APPROVE bias does NOT apply to documentation consistency (3b), infrastructure findings (3c), or tech-debt filing (7) — handle those regardless of the change's correctness; dropped production configuration is a blocking defect, not a style preference.

## 9. Output

Write a single JSON object to $REVIEW_OUTPUT_FILE using jq (proper JSON escaping):

  jq -n --arg verdict "APPROVE" --arg verdict_reason "one-line explanation" \
    --arg review_markdown "### Section\\n- **severity** \\`file:line\\`: description" \
    '{verdict: $verdict, verdict_reason: $verdict_reason, review_markdown: $review_markdown}' \
    > "$REVIEW_OUTPUT_FILE"

review_markdown is the complete formatted review: ### headings for sections; findings as
  - **severity** `file:line`: description

For a re-review, structure it as:
  ### Previous Findings
  - finding summary → FIXED / NOT FIXED / PARTIAL: explanation
  ### New Issues (if any)
  - **severity** `location`: description

Then STOP and wait — the orchestrator posts the review to the forge.
"""
