# formulas/run-architect.toml — the architect session's instructions
#
# A pitch is an ops-repo PR that adds sprints/<slug>.md. When it carries
# its goal and its sprint block, this formula is how the session drafts
# the sub-issues, or revises them on the owner's comments. Bash commits
# the pitch file as architect-bot and posts the reply with the lint
# report. The session never merges and never files: the owner's merge
# is the decision.
#
# Steps: ground, draft, lint, reply.
# The worktree is the project repo at main. Read it. Never edit, commit
# or push there, and never call the forge API.

name        = "run-architect"
description = "Architect: draft and revise the sub-issues of a pitch"
version     = 3

[context]
files = ["VISION.md", "AGENTS.md"]
# Prerequisite tree loaded from ops repo (ops: prefix)
# Sprints directory tracked in ops repo

[[steps]]
id    = "ground"
title = "Read the pitch, the note, and the code the entries will touch"
description = """
The prompt gives three paths:

- PITCH_FILE — the pitch as it stands on the PR branch
- BACKLOG_FILE — the open backlog issues, JSON (an array of objects with
  .number and .body, the same shape tools/pitch-lint.sh reads)
- COMMENT_FILE — the reply. Read it before you write it: if it already
  holds text, that text is the owner's comment. The comment may also be
  in the prompt. Either way, that comment is what a revision answers.

Read the pitch's goal, the first paragraph under `## What this enables`,
and its sprint block, the lines between `<!-- sprint:begin -->` and
`<!-- sprint:end -->`. Read `docs/design/notes/issue-writing.md`. Read
the `AGENTS.md` of each directory an entry will touch.

The worktree is the project repo at main. Read it. Never edit, commit
or push there. Never call the forge API. Bash already fetched the pitch
and the backlog; you only read and write the three paths.

Check every claim before you write it:

- the path exists (`ls`)
- the function or line is where you say (`grep -n`)
- the tests that cover it are named (`grep -rl <name> tests/`)

Do not invent a path, a function, a line, or a test name.
"""

[[steps]]
id    = "draft"
title = "Write or revise the sub-issue entries in the pitch file"
description = """
Write the entries into PITCH_FILE between `<!-- filer:begin -->` and
`<!-- filer:end -->`, under `## Sub-issues`. When those markers are not
in the file, append this at the end, then write the entries between the
markers:

## Sub-issues

<!-- filer:begin -->
<!-- filer:end -->

Change nothing else. The goal and the sprint block are the owner's.
Do not edit `## What this enables`, the sprint block, or any other
section. When revising, change only the entries the comment asks for.

The entry format is what `parse_subissue_entries` in `lib/sprint-filer.sh`
reads. One entry:

- id: <kebab-id>
  title: "<type>(<area>): <behaviour>"
  labels: [backlog]
  depends_on: [<ids>]
  body: |
    <body, every line indented by four spaces>

`depends_on` names other entries in this block, or is `[]`. A blank
line inside the body is four spaces, not an empty line, so the parser
keeps it inside the entry.

Each body follows `docs/design/notes/issue-writing.md`:

- An opening paragraph that names the sprint (the pitch file's slug)
  and the step, written "Step N of M".
- The headings: `## Problem`, `## Proposed solution`,
  `## Affected files`, `## Documentation`, `## Existing tests`,
  `## Acceptance criteria`, `## Acceptance test`. Add `## Dependencies`
  or `## Related` only when the rules below need them.
- At most 100 lines. At most two code files. A formula TOML counts as
  a code file; a path under `tests/` and a path ending in `.md` do not.
  List each path in backticks on its own `- ` line under
  `## Affected files`, so the lint can see it.
- One behaviour. "And" in the title is two entries.
- No deploy or ops steps. A backlog issue is code into the repo.
- Under `## Documentation`, the exact old wording and the exact new
  wording. When nothing documents the code yet, write "None" and why.
- Under `## Acceptance criteria`, runnable checks with stubs (at least
  one line that is `- [ ]`).
- Under `## Acceptance test`, the line `tests/acceptance/issue-<N>.sh`,
  with `<N>` written literally. The number does not exist until filing.

Chain. When two entries change the same file, the later one lists the
earlier id in `depends_on`. A dependency on an existing issue is not a
`depends_on` id. It is a `- #N` line under that body's own
`## Dependencies`.

Overlap. Read BACKLOG_FILE. Never duplicate an open issue: if an open
issue already asks for the behaviour, do not write an entry for it.
An entry that changes a file an open issue names under
`## Affected files` depends on that issue (`- #N` under
`## Dependencies`), or says under `## Related` why it does not.
"""

[[steps]]
id    = "lint"
title = "Run pitch-lint and fix every ERROR"
description = """
Run:

  tools/pitch-lint.sh "$PITCH_FILE" "$BACKLOG_FILE"

Fix every ERROR and run it again, until the report has no ERROR.
Keep a WARN only when you can say why, and say that why in the reply.
A WARN you cannot justify is an entry to fix, then lint again.
Warnings do not change the tool's exit code; an ERROR does. Do not
leave an ERROR for bash to post.
"""

[[steps]]
id    = "reply"
title = "Write the summary the owner will read"
description = """
Write COMMENT_FILE in markdown. Overwrite whatever was in it.

One line per entry: its id, its title, the files it changes, and its
`depends_on`. Then a heading `### Open questions`, numbered: the design
forks the owner must decide, or the single line "None". Do not bury an
undecided fork inside an entry.

When revising, start the file with what changed and which comment asked
for it. When drafting, do not invent a comment.

Bash commits PITCH_FILE and posts COMMENT_FILE with the lint report.
You never post, merge, close or file anything. The owner's merge is
the decision.
"""
