# formulas/run-planner.toml — Planner proposes one sprint pitch, or nothing (v5)
#
# The single planner formula: planner-run.sh always loads this file.
# One step, propose. The planner writes at most one pitch file, or nothing.
# It does not triage predictions, does not write the prerequisite tree,
# does not file issues, and does not pitch an access request.
# Open prediction issues stay as they are until the predictor sprint.
#
# Executed directly by planner-run.sh via the polling loop (planned on
# PLANNER_INTERVAL, default 12h) — no action issues. The session writes
# the pitch (and, when needed, the probe) to scratch files. It does not
# commit, push, or run a rung.

name        = "run-planner"
description = "Planner: propose one sprint pitch, or nothing"
version     = 5

[[steps]]
id    = "propose"
title = "Write one pitch file, or nothing"
description = """
The prompt contains `ladder: none` or `ladder: <rung>`.

When that line is not `ladder: none`, write nothing.

When it is `ladder: none`, read `VISION.md`, the claims catalog
(`${CLAIMS_CATALOG:-$OPS_REPO_ROOT/catalog/claims.md}`), and
`RESOURCES.md`. Write at most one pitch to `$PLANNER_PITCH_FILE`
(default `/tmp/planner-pitch.md`), or write nothing. That pitch is the
next step toward the vision, or nothing. It is not an access request.
The reach rung's sprint handles access requests.

That file starts with `# Sprint: <title>`, has `## What this enables`
and one paragraph, and a sprint block with `class`, `effect`, `expect`,
and `soak`. `class` is `internal`, `experiment`, or `deploy`. `effect`
is `none`, or `probes/<name>.sh` with no `..`. No filer block. No
sub-issues. Do not write `filer:begin`.

The sprint block is the lines between `<!-- sprint:begin -->` and
`<!-- sprint:end -->`, which is what `pitch_sprint_block` reads:

  <!-- sprint:begin -->
  class: <internal | experiment | deploy>
  effect: <none | probes/<name>.sh>
  expect: <operator and a number, e.g. >= 1>
  soak: <integer + d or h, e.g. 7d>
  <!-- sprint:end -->

When `effect` is `probes/<name>.sh` and that path is not already a file
in the ops repo, also write the probe to `$PLANNER_PROBE_FILE` (default
`/tmp/planner-probe.sh`). Do not commit it. The same pitch adds it next
to `sprints/<slug>.md`.

Do not file an issue.

Do not relabel or close a prediction. Open prediction issues stay as
they are. Do not write the prerequisite tree. Do not write a vault
pending item. Do not commit. Do not push. Do not run a rung.
"""
