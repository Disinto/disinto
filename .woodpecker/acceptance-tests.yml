# =============================================================================
# .woodpecker/acceptance-tests.yml — post-merge deploy of the edge.
#
# Runs on every push to main, on the disinto-nomad-box runner:
#   1. detect-changes      — did the merge touch the edge runtime (docker/edge,
#                              bin/snapshot-*, edge.hcl)? Sets a flag for step 2.
#   2. rebuild-and-deploy  — under the deploy lock: fast-forward /opt/disinto
#                              (the host checkout the edge runs the dispatcher
#                              and the snapshot daemon from) to this commit;
#                              when the flag is set, rebuild disinto/edge:local
#                              from it, run and restart the edge job, and poll
#                              until its allocation is running (<= 120s).
#
# No acceptance tests run here since 2026-10-05. Each PR runs the tests it can
# break before merge (the acceptance-affected step of ci.yml). The post-merge
# test run this file is named for never worked: Woodpecker pre-expands
# dollar-brace references in commands, which blanked the issue number and the
# PR lookup, so it found no closed issue and ran no test. A test that needs the
# live box (header line "# acceptance-ci: skip") is run by hand on the box:
# tools/run-acceptance.sh <N>.
#
# Concurrency:
#   Two pushes to `main` arriving back-to-back must NOT race the deploy step
#   (the second deploy could land on a half-spawned alloc). Woodpecker has
#   no first-class workflow lock, so we serialise via `flock` against a
#   well-known lock file on the runner host. The runner *must* be the
#   disinto-nomad-box (so the lock file is shared); enforced via labels
#   below.
# =============================================================================

when:
  - event: push
    branch: main

# Generous: the deploy can wait up to 10 minutes for the lock, then builds.
timeout: 30m

# Pin the workflow to the live runner: the deploy step needs the host's docker
# daemon, nomad and /opt/disinto, and the flock file lives there.
labels:
  host: disinto-nomad-box

# Authenticated clone — same shape as ci.yml. Forgejo requires sign-in.
clone:
  git:
    image: alpine/git
    commands:
      - |
        # depth 2 (not 1) so the detect-changes step can `git diff HEAD^..HEAD`
        # to decide whether the merge touched runtime paths.
        if [ -n "${FORGE_TOKEN:-}" ]; then
          AUTH_URL=$(printf '%s' "$CI_REPO_CLONE_URL" | sed "s|://|://token:${FORGE_TOKEN}@|")
          git clone --depth 2 "$AUTH_URL" .
        else
          git clone --depth 2 "$CI_REPO_CLONE_URL" .
        fi
      # Fetch the commit this pipeline is for, not the branch tip: main moves
      # on while a pipeline waits in the queue, and detect-changes then judged
      # a later merge (pipeline 3626 ran for b882490, an edge.hcl change, but
      # checked out d329e91, a docs merge, and skipped the redeploy).
      - git fetch --depth 2 origin "$CI_COMMIT_SHA"
      - git checkout FETCH_HEAD

steps:
  # ── 1. Decide whether a redeploy is needed ────────────────────────────────
  # A merge that only touches docs / tests / formulas does not need to
  # rebuild the edge image or restart the nomad job. Compare the merge
  # commit's diff against its first parent and look for paths that *do*
  # affect the live runtime. The decision is written to a workspace file
  # so subsequent steps can read it without re-running git.
  - name: detect-changes
    image: alpine/git
    commands:
      - |
        set -e
        mkdir -p .ci
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          changed="$(git diff --name-only HEAD^..HEAD)"
        else
          # Initial commit (no parent). Treat as "no runtime change".
          changed=""
        fi
        echo "$changed" > .ci/changed-paths.txt
        if echo "$changed" | grep -E \
             '^(docker/edge/|bin/snapshot-|nomad/jobs/edge\.hcl$)' \
             >/dev/null; then
          echo "yes" > .ci/needs-redeploy
          echo "detect-changes: redeploy required (matched runtime paths)"
        else
          echo "no" > .ci/needs-redeploy
          echo "detect-changes: docs/tests-only merge, skipping redeploy"
        fi

  # ── 2. Rebuild the edge image and re-launch the nomad job ─────────────────
  # The step image (docker:27-cli) ships the docker CLI but NO nomad binary,
  # so every `nomad` call runs in a helper container on the host network
  # namespace, spawned through the mounted docker socket (same idiom as
  # ci.yml's rebuild-and-deploy-agents, #1173). The box's Nomad API is
  # loopback-only (bind_addr 127.0.0.1 in nomad/server.hcl), hence
  # --network host. The helper mounts the edge jobspec staged from this
  # commit under /var/lib/disinto/ci-locks, resolved by the host's docker
  # daemon (same staging as ci.yml's agents redeploy, #1735).
  #
  # The flock guarantees that two simultaneous merges to main do not stomp
  # on each other's deploy: the second pipeline blocks here until the first
  # releases the lock. -w 600 caps wait at 10 minutes so a stuck pipeline
  # does not block the queue indefinitely.
  #
  # Health-poll loop: `nomad job status edge` reports per-allocation health.
  # We loop ≤24 times at 5s intervals (=120s) waiting for the latest version's
  # allocs to be `running`. A failed or empty status response is treated as
  # NOT healthy — the old `|| echo '{}'` fallback let a transient CLI/API
  # failure read as "zero unhealthy allocations" and pass the gate.
  # This is intentionally simple — the script is short enough to read; a
  # more sophisticated check belongs in the nomad-cli wrapper (see #786 plan).
  - name: rebuild-and-deploy
    # docker:27-cli or newer: the host daemon (Docker 29) refuses API < 1.44,
    # and docker:24-cli speaks 1.43.
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/disinto/ci-locks:/var/lib/disinto/ci-locks
      - /opt/disinto:/opt/disinto
    commands:
      - |
        set -e
        apk add --no-cache util-linux jq curl bash git
        NOMAD_IMAGE=hashicorp/nomad:1.9.5
        OPT=/opt/disinto
        # No nomad binary in this image — run the CLI in a helper container
        # on the host network (Nomad listens on loopback only). The helper
        # mounts a host directory the edge jobspec is staged into from $OPT
        # (below, under the lock). The directory sits under the ci-locks
        # volume, so the daemon sees the same path. Paths passed to nomad_api
        # are relative to /jobspecs.
        JOBSPECS=/var/lib/disinto/ci-locks/jobspecs-edge
        nomad_api() {
          docker run --rm --network host \
            -e NOMAD_ADDR=http://127.0.0.1:4646 \
            -v "$JOBSPECS":/jobspecs:ro \
            "$NOMAD_IMAGE" "$@"
        }

        # Serialize across concurrent pipelines. -w 600 = 10-minute cap.
        # mkdir MUST come before the `exec 9>` redirection — if the directory
        # is missing, opening the fd fails and `set -e` aborts the step.
        mkdir -p /var/lib/disinto/ci-locks
        exec 9>/var/lib/disinto/ci-locks/acceptance-deploy.lock
        flock -w 600 9 || { echo "could not acquire deploy lock"; exit 1; }

        # Advance $OPT to this commit, on every merge. The edge runs the
        # dispatcher and the snapshot daemon from that host checkout
        # (entrypoint-edge.sh, edge.hcl), and edge-threads-gc and
        # agent-logs-rotate run scripts from it; nothing else updated it, and
        # it sat 416 commits behind main until 2026-10-04. Fetch by this
        # pipeline's clone URL, not a remote name (the checkout's remotes are
        # whatever its installer made: "forge" on disinto-nomad-box, "origin"
        # in the docs). Fast-forward only: a pipeline that runs late from the
        # queue finds $OPT already past its commit and leaves it alone, and a
        # local edit or a diverged branch fails the step instead of being
        # overwritten.
        git -c safe.directory="$OPT" -C "$OPT" fetch -q "$CI_REPO_CLONE_URL" "$CI_COMMIT_SHA"
        if git -c safe.directory="$OPT" -C "$OPT" merge-base --is-ancestor FETCH_HEAD HEAD; then
          echo "rebuild-and-deploy: $OPT already at or past this commit, not moved"
        else
          git -c safe.directory="$OPT" -C "$OPT" merge -q --ff-only FETCH_HEAD
        fi
        echo "rebuild-and-deploy: $OPT at $(git -c safe.directory="$OPT" -C "$OPT" rev-parse --short HEAD)"

        if [ "$(cat .ci/needs-redeploy 2>/dev/null || echo no)" != "yes" ]; then
          echo "rebuild-and-deploy: no edge restart (no runtime paths changed)"
          exit 0
        fi

        # Build and stage from $OPT, not the workspace: $OPT is at this commit
        # or a newer one, so a late pipeline never redeploys older code. Under
        # the lock, so a concurrent pipeline cannot swap the jobspec mid-deploy.
        rm -rf "$JOBSPECS"
        mkdir -p "$JOBSPECS"
        cp "$OPT/nomad/jobs/edge.hcl" "$JOBSPECS"/

        echo "rebuild-and-deploy: docker build disinto/edge:local from $OPT"
        docker build -t disinto/edge:local -f "$OPT/docker/edge/Dockerfile" "$OPT"

        echo "rebuild-and-deploy: nomad job run /jobspecs/edge.hcl"
        nomad_api job run /jobspecs/edge.hcl
        # The image tag (:local) does not change, so job run alone keeps the
        # old image whenever the jobspec is unchanged; restart brings the
        # allocation back on the rebuilt image (same as the agents redeploy
        # in ci.yml). -on-error=fail: the default asks, and exits 1 with no TTY.
        echo "rebuild-and-deploy: nomad job restart edge"
        nomad_api job restart -on-error=fail edge

        # Poll until the new alloc is healthy, ≤120s.
        deadline=$(( $(date +%s) + 120 ))
        while [ "$(date +%s)" -lt "$deadline" ]; do
          status_json="$(nomad_api job status -json edge 2>/dev/null || echo '')"
          # A failed or empty status is NOT healthy — only a parsed response
          # with zero unhealthy allocs passes the gate.
          if [ -n "$status_json" ] && [ "$status_json" != "{}" ] && [ "$status_json" != "[]" ]; then
            # All the latest-version allocs must have ClientStatus=running.
            # `nomad job status -json` returns a one-element array
            # ([{Allocations:[...]}]), not a plain object — unwrap it first
            # (same filter as ci.yml, #1522) so `.Allocations` indexes the
            # object, not the array (a raw `.Allocations` would jq-exit 5).
            # Two-pass: compute the max JobVersion across all allocs, then
            # filter for unhealthy allocs at that version. An empty allocation
            # list reads as unhealthy, and a parse failure falls back to
            # `|| echo 1`, so a broken response never passes the gate and
            # never aborts the step under `set -e`.
            unhealthy="$(echo "$status_json" \
              | jq -r '
                  (if type == "array" then (.[0] // {}) else . end) as $root
                  | ($root.Allocations // []) as $a
                  | if ($a | length) == 0 then 1
                    else (($a | map(.JobVersion // 0) | max) // 0) as $v
                      | $a | map(select((.JobVersion // 0) == $v
                                         and .ClientStatus != "running"))
                      | length
                    end' || echo 1)"
            # Plain $unhealthy, never the dollar-brace form with a default:
            # Woodpecker pre-expands that at parse time, and the check read
            # the literal 1 = 0 and never passed (pipelines 3707-3716). The
            # jq above falls back to 1, so the variable is never empty.
            if [ "$unhealthy" = "0" ]; then
              echo "rebuild-and-deploy: edge job healthy"
              exit 0
            fi
          fi
          sleep 5
        done
        echo "rebuild-and-deploy: edge job not healthy after 120s" >&2
        nomad_api job status edge >&2 || true
        exit 1
