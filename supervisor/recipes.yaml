# supervisor/recipes.yaml — Procedural recipe library for abnormal-signal detection
#
# Each recipe maps a preflight.sh output section + rule to a severity level
# and an optional remediation action. The evaluator (evaluate-recipes.sh)
# consumes this file before any LLM invocation.
#
# Schema:
#   name:        unique identifier (snake_case)
#   severity:    P0–P4 (mirrors formulas/run-supervisor.toml tiers)
#   detect:
#     source:    preflight          # always "preflight" for this library
#     section:   "<preflight heading>"  # matches "## <section>" lines
#     rule:      <rule_name>
#     threshold: <number>            # numeric comparison value (rule-dependent)
#     field:     "<field name>"     # for field_eq rules
#     value:     "<value>"           # for field_eq rules
#   action:      direct | vault | incident | llm
#   action_script: "<path>"          # optional; only when action=direct

recipes:

  # ── P0: Memory crisis ──────────────────────────────────────────────────

  # free -m in the agents container reports the host, not the disinto box.
  - name: memory-crisis-low-ram
    severity: P0
    detect:
      source: preflight
      section: "System Resources"
      rule: ram_available_mb_lt
      threshold: 500
    action: incident

  # ── P1: Disk pressure / public endpoint down / unregistered service ────

  - name: disk-pressure
    severity: P1
    detect:
      source: preflight
      section: "System Resources"
      rule: disk_pct_gt
      threshold: 80
    action: direct
    action_script: supervisor/actions/disk-pressure.sh

  # Monitor: a public URL failed on two ticks in a row. No remedy (#1923).
  - name: public-endpoint-down
    severity: P1
    detect:
      source: preflight
      section: "Public Endpoints"
      rule: field_eq
      field: "Public Endpoints"
      value: "DOWN"
    action: incident

  # Monitor: snapshot reports an unregistered Nomad service. No remedy (#1927).
  - name: nomad-service-unregistered
    severity: P1
    detect:
      source: preflight
      section: "Nomad Services"
      rule: field_eq
      field: "Nomad Services"
      value: "MISSING"
    action: incident

  # ── P2: Factory stopped / stalled ──────────────────────────────────────

  - name: wp-agent-unhealthy
    severity: P2
    detect:
      source: preflight
      section: "Woodpecker Agent Health"
      rule: field_eq
      field: "WP Agent Health"
      value: "UNHEALTHY"
    action: incident

  - name: ci-stuck
    severity: P2
    detect:
      source: preflight
      section: "CI Pipelines"
      rule: stuck_gt
      threshold: 0
    action: incident

  - name: ci-pending-stale
    severity: P2
    detect:
      source: preflight
      section: "CI Pipelines"
      rule: pending_gt
      threshold: 0
    action: incident

  - name: git-broken-rebase
    severity: P2
    detect:
      source: preflight
      section: "Lock Files"
      rule: field_eq
      field: "git-rebase"
      value: "broken"
    action: direct
    action_script: supervisor/actions/git-rebase-fix.sh

  # ── P3: Factory degraded ──────────────────────────────────────────────

  - name: pr-stale
    severity: P3
    detect:
      source: preflight
      section: "Open PRs"
      rule: stale_prs_gt
      threshold: 0
    action: incident

  # ── P4: Housekeeping ───────────────────────────────────────────────────

  - name: stale-worktree
    severity: P4
    detect:
      source: preflight
      section: "Stale Worktrees"
      rule: any_older_than_min
      threshold: 120
    action: direct
    action_script: supervisor/actions/cleanup-worktrees.sh

  - name: lock-file-dead
    severity: P4
    detect:
      source: preflight
      section: "Lock Files"
      rule: dead_lock_gt
      threshold: 0
    action: direct
    action_script: supervisor/actions/cleanup-locks.sh

  # ── P4: Housekeeping ──────────────────────────────────────────────────

  - name: cleanup-phase-files
    severity: P4
    detect:
      source: preflight
      section: "Phase Files"
      rule: escalate_phase_gt
      threshold: 0
    action: direct
    action_script: supervisor/actions/cleanup-phase-files.sh

  # ── Research Runs (run-ledger, #1293/#1297) ────────────────────────────
  # Experiment-run health, all incident actions (a human or a bash recipe
  # resolves — the supervisor only files the incident, #1322).

  - name: artifacts-disk
    severity: P1
    detect:
      source: preflight
      section: "Research Runs"
      rule: disk_pct_gt
      threshold: 80
    action: incident

  - name: run-heartbeat-stale
    severity: P2
    detect:
      source: preflight
      section: "Research Runs"
      rule: any_older_than_min
      threshold: 70
    action: incident

  - name: judgment-stale
    severity: P3
    detect:
      source: preflight
      section: "Research Runs"
      rule: judgment_age_h_gt
      threshold: 4
    action: incident
